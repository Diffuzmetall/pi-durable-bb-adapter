name: Verify portable native adapter

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run doctor
      - name: Install pinned Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --output tool.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  tool.tar.gz' | sha256sum --check --strict
          tar -xzf tool.tar.gz gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --config .gitleaks.toml --redact --no-banner'
      - name: Scan compatibility archive contents
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir compat --max-archive-depth 2 --config .gitleaks.toml --redact --no-banner'

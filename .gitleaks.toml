[extend]
useDefault = true

[[allowlists]]
description = "Computed SHA-256 file checksums, not credentials (integrity manifest only)"
condition = "AND"
paths = ['''(^|/)compat/manifest\.json$''']
regexTarget = "match"
regexes = ['''[A-Za-z0-9_./@-]+\.(?:[cm]?[jt]s|json|sql|h|gyp|md)"\s*:\s*"[a-f0-9]{64}"''']

[[allowlists]]
description = "BB bundled auth library's JavaScript property-access expression, not a literal key"
regexTarget = "secret"
regexes = ['''^apiKey2\.permissions$''']

[[allowlists]]
description = "Historical BB0 source-integrity log pairs: api.js filename and computed SHA-256"
condition = "AND"
paths = ['''(^|/)evidence/BB0/shared-required-fixture/logs/[^/]+\.log$''']
regexTarget = "match"
regexes = ['''^api\.js","[a-f0-9]{64}"$''']

[[allowlists]]
description = "Historical DCG README prose, not a credential"
condition = "AND"
paths = ['''(^|/)candidates/host/packages/coding-agent/src/experimental/durable/dcg/README\.md$''']
regexTarget = "secret"
regexes = ['''^evaluator/diagnostic$''']

[[allowlists]]
description = "SQLite C API member names and FTS5 constant; reviewed identifiers, not key literals"
regexTarget = "match"
regexes = ['''^sqlite3_api->(?:column_bytes16|soft_heap_limit64|hard_heap_limit64)$''', '''^iKey==FTS5_AVERAGES_ROWID\s*$''']

[[allowlists]]
description = "Canonical jwt.io John Doe sample in upstream Zod parser tests"
regexTarget = "secret"
regexes = ['''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c$''']

[[allowlists]]
description = "Zod URL-preservation fixture: exact public example.com query value, not service authentication"
regexTarget = "secret"
regexes = ['''^NUXOmHqWNVTapJkJJHw8BfD155AuqhH_qju_5fNmQ4ZHV7u8$''']
